<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lab Network Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f4e9c'/%3E%3Ccircle cx='16' cy='14' r='5' fill='none' stroke='white' stroke-width='2.5'/%3E%3Cpath d='M16 27l-7-9h14z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
html,body{margin:0}
/* Layout: header and filters on top, KPI strip, then a sticky map beside a tabbed decision panel. */
:root {
  --bg: #f1f4f9; --surface: #ffffff; --surface-2: #e9eef6; --surface-3: #dde5f0;
  --ink: #111a2b; --ink-2: #434e66; --ink-3: #66718a; --line: #d9e0ec; --line-2: #c3cddd;
  --accent: #2a78d6; --accent-ink: #ffffff; --accent-soft: #e2edfb;
  --map-bg: #e7edf5; --grid: #d1dae8; --ord: #5d6e8f; --gap: #d4417d; --violet: #6250d6; --orange: #eb6834;
  --good: #0ca30c; --good-ink: #07700a; --warn: #fab219; --warn-ink: #8a5a00; --serious: #ec835a; --serious-ink: #a8431c; --crit: #d03b3b; --crit-ink: #a52828;
  --shadow: 0 6px 24px rgba(17, 26, 43, .14);
  --f-sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131c; --surface: #161c28; --surface-2: #1d2533; --surface-3: #283248;
    --ink: #e8edf6; --ink-2: #b2bcd0; --ink-3: #8b95ac; --line: #273044; --line-2: #36425a;
    --accent: #3987e5; --accent-ink: #0b1220; --accent-soft: #15294a;
    --map-bg: #0f1520; --grid: #1b2536; --ord: #93a4c4; --gap: #ea6ba1; --violet: #9085e9; --orange: #d95926;
    --good-ink: #52d052; --warn-ink: #f0b93a; --serious-ink: #f0997a; --crit-ink: #ef7d7d;
    --shadow: 0 6px 24px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131c; --surface: #161c28; --surface-2: #1d2533; --surface-3: #283248;
  --ink: #e8edf6; --ink-2: #b2bcd0; --ink-3: #8b95ac; --line: #273044; --line-2: #36425a;
  --accent: #3987e5; --accent-ink: #0b1220; --accent-soft: #15294a;
  --map-bg: #0f1520; --grid: #1b2536; --ord: #93a4c4; --gap: #ea6ba1; --violet: #9085e9; --orange: #d95926;
  --good-ink: #52d052; --warn-ink: #f0b93a; --serious-ink: #f0997a; --crit-ink: #ef7d7d;
  --shadow: 0 6px 24px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.app { max-width: 1680px; margin: 0 auto; padding-block: 14px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.top h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.top .sub { margin: 2px 0 0; color: var(--ink-3); font-size: 13px; }
.top .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 6px; font-size: 13px; line-height: 1.2; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; border: 1px solid var(--line); }
.badge.sample { background: color-mix(in srgb, var(--warn) 18%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); color: var(--ink); }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > label, .field > .lab { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.input, details.dd > summary { height: 32px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); font-size: 13px; display: flex; align-items: center; min-width: 140px; }
.input[type=date] { min-width: 140px; }
.input:disabled { opacity: .5; }
details.dd { position: relative; }
details.dd > summary { list-style: none; cursor: pointer; justify-content: space-between; gap: 8px; }
details.dd > summary::-webkit-details-marker { display: none; }
details.dd > summary::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); transform: rotate(45deg) translateY(-2px); flex: none; }
.dd-pop { position: absolute; z-index: 40; top: 36px; left: 0; width: 270px; max-width: 86vw; max-height: 340px; overflow: auto; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--shadow); padding: 8px; }
.dd-pop .row { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-radius: 4px; font-size: 13px; cursor: pointer; }
.dd-pop .row:hover { background: var(--surface-2); }
.dd-pop .row .n { margin-left: auto; color: var(--ink-3); font-size: 12px; }
.dd-pop .q { width: 100%; margin-bottom: 6px; }
.dd-pop .foot { display: flex; justify-content: space-between; padding: 6px 4px 0; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }

/* summary */
.headline { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 120ch; text-wrap: pretty; }
.headline b { color: var(--ink); font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.tile .l { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.tile .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 23px; font-weight: 500; margin: 2px 0; letter-spacing: -.02em; }
.tile .v small { font-size: 13px; color: var(--ink-3); font-weight: 400; margin-left: 3px; }
.tile .s { font-size: 12px; color: var(--ink-3); }

/* main grid */
.grid { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.mapcard { position: sticky; top: 8px; height: calc(100vh - 20px); max-height: 800px; min-height: 480px; background: var(--map-bg); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; touch-action: none; }
.mapcard canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.mapcard canvas.drag { cursor: grabbing; }
.mt { position: absolute; display: flex; gap: 6px; flex-wrap: wrap; z-index: 3; }
.mt.tl { top: 10px; left: 10px; right: 56px; }
.mt.tr { top: 10px; right: 10px; flex-direction: column; }
.chip { height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-2); background: color-mix(in srgb, var(--surface) 92%, transparent); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.zbtn { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); font-size: 16px; line-height: 1; display: grid; place-items: center; }
.zbtn:hover { background: var(--surface-2); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 0 10px; height: 26px; font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.legend { position: absolute; right: 10px; bottom: 10px; z-index: 3; background: color-mix(in srgb, var(--surface) 94%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 11px; display: grid; gap: 2px; max-width: 210px; }
.legend .li { display: flex; align-items: center; gap: 7px; color: var(--ink-2); }
.legend svg { flex: none; }
.legend .scale { display: flex; align-items: center; gap: 6px; color: var(--ink-3); margin-top: 2px; }
.legend .scale span { white-space: nowrap; }
.legend .bar { flex: none; }
.legend .bar { height: 5px; border: 1.5px solid var(--ink-2); border-top: 0; }
.mapinfo { position: absolute; left: 10px; bottom: 10px; z-index: 3; width: min(310px, calc(100% - 250px)); min-width: 240px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 10px 12px; font-size: 12px; box-shadow: var(--shadow); max-height: 62%; overflow: auto; }
.mapinfo h4 { margin: 0 0 2px; font-size: 14px; font-weight: 600; padding-right: 22px; }
.mapinfo .x { position: absolute; top: 6px; right: 6px; border: 0; background: none; font-size: 16px; color: var(--ink-3); width: 24px; height: 24px; }
.mapinfo dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 8px 0; }
.mapinfo dt { color: var(--ink-3); }
.mapinfo dd { margin: 0; text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.mapinfo p { margin: 6px 0 0; color: var(--ink-2); }
.maphint { position: absolute; left: 12px; top: 44px; z-index: 2; font-size: 11px; color: var(--ink-3); pointer-events: none; }

/* panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--line); padding: 0 6px; scrollbar-width: thin; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 11px 12px 9px; font-size: 13px; color: var(--ink-3); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.tabs .ct { font-family: var(--f-mono); font-size: 11px; background: var(--surface-2); border-radius: 999px; padding: 0 6px; color: var(--ink-2); }
.tabs .sep { width: 1px; background: var(--line); margin: 8px 6px; flex: none; }
.pane { padding: 14px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.pane h3 { margin: 0; font-size: 14px; font-weight: 600; }
.pane h3 small { font-weight: 400; color: var(--ink-3); font-size: 12px; margin-left: 6px; }
.note { margin: 0; color: var(--ink-2); font-size: 13px; text-wrap: pretty; }
.note.muted, .muted { color: var(--ink-3); }
.sumrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.empty { padding: 18px; border: 1px dashed var(--line-2); border-radius: 8px; color: var(--ink-2); font-size: 13px; }
.empty b { color: var(--ink); }

/* tables */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th { text-align: left; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th.r, td.r { text-align: right; }
td.r { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
tr.sel td { background: var(--accent-soft); }
tr.trow td { border-bottom: 0; padding-bottom: 4px; }
tr.whyrow td { padding: 0 10px 10px; color: var(--ink-2); font-size: 12px; text-wrap: pretty; }
tr.click:hover + tr.whyrow td, tr.trow.click:has(+ tr.whyrow:hover) td { background: var(--surface-2); }
tr.sel + tr.whyrow td { background: var(--accent-soft); }
td .t { font-weight: 500; }
td:first-child { min-width: 150px; }
td .sub { display: block; color: var(--ink-3); font-size: 11.5px; margin-top: 2px; font-weight: 400; }
td .why { display: block; color: var(--ink-2); font-size: 12px; margin-top: 4px; max-width: 58ch; text-wrap: pretty; }
td .pm { color: var(--ink-3); font-size: 11px; display: block; white-space: normal; text-align: right; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; border: 1px solid transparent; }
.pill i { font-style: normal; font-size: 10px; }
.p-good { background: color-mix(in srgb, var(--good) 15%, var(--surface)); color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 35%, var(--surface)); }
.p-queue { background: var(--surface); color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 55%, var(--surface)); }
.p-warn { background: color-mix(in srgb, var(--warn) 20%, var(--surface)); color: var(--warn-ink); border-color: color-mix(in srgb, var(--warn) 50%, var(--surface)); }
.p-serious { background: color-mix(in srgb, var(--serious) 18%, var(--surface)); color: var(--serious-ink); border-color: color-mix(in srgb, var(--serious) 45%, var(--surface)); }
.p-crit { background: color-mix(in srgb, var(--crit) 14%, var(--surface)); color: var(--crit-ink); border-color: color-mix(in srgb, var(--crit) 40%, var(--surface)); }
.p-neutral { background: var(--surface-2); color: var(--ink-2); border-color: var(--line); }
.p-violet { background: color-mix(in srgb, var(--violet) 16%, var(--surface)); color: var(--ink); border-color: color-mix(in srgb, var(--violet) 45%, var(--surface)); }
.p-blue { background: var(--accent-soft); color: var(--ink); border-color: color-mix(in srgb, var(--accent) 40%, var(--surface)); }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchips .chip { height: 28px; }

/* charts */
.chart { border: 1px solid var(--line); border-radius: 8px; padding: 10px 10px 6px; background: var(--surface); min-width: 0; }
.chart h4 { margin: 0 0 4px; font-size: 12.5px; font-weight: 500; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-3); font-family: var(--f-sans); font-size: 10.5px; }
.chart .lbl { fill: var(--ink-2); }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .gate { stroke: var(--ink-3); stroke-dasharray: 4 3; stroke-width: 1; fill: none; }
.lg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--ink-2); margin: 4px 0 2px; }
.lg span { display: inline-flex; align-items: center; gap: 6px; }
.lg i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.tip { position: fixed; z-index: 90; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-radius: 6px; padding: 6px 9px; font-size: 12px; box-shadow: var(--shadow); max-width: 260px; }
.tip b { display: block; font-weight: 600; }
.tip .mono { color: var(--ink-2); }

/* parameters, data */
.pgroup { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.pgroup h3 { font-size: 13px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.param { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.param label { font-size: 12.5px; font-weight: 500; }
.param .ig { display: flex; align-items: center; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); overflow: hidden; }
.param .ig:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.param input, .param select { border: 0; background: transparent; padding: 6px 8px; width: 100%; min-width: 0; height: 32px; font-family: var(--f-mono); font-size: 13px; }
.param input:focus-visible, .param select:focus-visible { outline: none; }
.param .u { padding: 0 9px; color: var(--ink-3); font-size: 12px; white-space: nowrap; border-left: 1px solid var(--line); height: 32px; display: flex; align-items: center; background: var(--surface-2); }
.param .h { font-size: 11.5px; color: var(--ink-3); text-wrap: pretty; }
.param.chg input { color: var(--accent); }
.drop { border: 1.5px dashed var(--line-2); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop h3 { font-size: 13px; }
.mapgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 12px; }
.mapgrid select { height: 30px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); padding: 0 6px; width: 100%; font-size: 12.5px; }
.mapgrid label { font-size: 11.5px; color: var(--ink-3); display: block; margin-bottom: 2px; }
.alert { padding: 9px 12px; border-radius: 8px; font-size: 12.5px; border: 1px solid var(--line-2); background: var(--surface-2); }
.alert.err { border-color: color-mix(in srgb, var(--crit) 50%, var(--surface)); background: color-mix(in srgb, var(--crit) 10%, var(--surface)); }
.alert.warn { border-color: color-mix(in srgb, var(--warn) 55%, var(--surface)); background: color-mix(in srgb, var(--warn) 14%, var(--surface)); }
.alert.ok { border-color: color-mix(in srgb, var(--good) 45%, var(--surface)); background: color-mix(in srgb, var(--good) 10%, var(--surface)); }
.alert ul { margin: 4px 0 0; padding-left: 18px; }
.method h3 { margin-top: 4px; }
.method p, .method li { font-size: 13px; color: var(--ink-2); max-width: 78ch; text-wrap: pretty; }
.method ul, .method ol { margin: 4px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.method code, .code { font-family: var(--f-mono); font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; color: var(--ink); }
.formula { font-family: var(--f-mono); font-size: 12px; background: var(--surface-2); border-radius: 6px; padding: 8px 10px; color: var(--ink); overflow-x: auto; white-space: pre; }
.mrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
.mrow .meta { min-width: 0; }
.mrow .meta b { font-weight: 600; }
.mrow .meta span { display: block; color: var(--ink-3); font-size: 12px; }

/* modal + toast */
.modal { position: fixed; inset: 0; z-index: 80; background: rgba(8, 12, 22, .5); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal[hidden] { display: none; }
.mcard { background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 18px; width: min(560px, 100%); max-height: 88vh; overflow: auto; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.mcard h2 { margin: 0; font-size: 16px; }
.mcard .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.radio { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border: 1px solid var(--line-2); border-radius: 8px; cursor: pointer; }
.radio input { margin-top: 3px; }
.radio b { display: block; font-size: 13px; }
.radio span { font-size: 12px; color: var(--ink-3); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 95; background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 13px; max-width: 90vw; }
.busy { position: fixed; inset: 0; z-index: 85; display: grid; place-items: center; background: rgba(8, 12, 22, .35); color: #fff; font-size: 14px; }
.busy[hidden], .toast[hidden], .tip[hidden], .mapinfo[hidden] { display: none; }
.busy div { background: var(--surface); color: var(--ink); padding: 12px 18px; border-radius: 8px; border: 1px solid var(--line-2); }

@media (max-width: 1100px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .mapcard { position: relative; top: 0; height: 520px; min-height: 0; }

    s += `<rect x="${X(0)}" y="${Y(ymax)}" width="${X(c.upBreachMax) - X(0)}" height="${Y(c.upNpsMin) - Y(ymax)}" style="fill:var(--good);opacity:.07"/><line class="gate" x1="${X(c.upBreachMax)}" x2="${X(c.upBreachMax)}" y1="${mt}" y2="${Ht - mb}"/><line class="gate" x1="${ml}" x2="${Wd - mr}" y1="${Y(c.upNpsMin)}" y2="${Y(c.upNpsMin)}"/><text x="${X(0) + 5}" y="${Y(ymax) + 12}" style="fill:var(--good-ink)">Upgrade zone</text>`;
  } else {
    s += `<rect x="${X(c.clBreachMin)}" y="${mt}" width="${X(xmax) - X(c.clBreachMin)}" height="${Ht - mb - mt}" style="fill:var(--crit);opacity:.06"/><rect x="${ml}" y="${Y(c.clNpsMax)}" width="${Wd - ml - mr}" height="${Y(ymin) - Y(c.clNpsMax)}" style="fill:var(--crit);opacity:.06"/><line class="gate" x1="${X(c.clBreachMin)}" x2="${X(c.clBreachMin)}" y1="${mt}" y2="${Ht - mb}"/><line class="gate" x1="${ml}" x2="${Wd - mr}" y1="${Y(c.clNpsMax)}" y2="${Y(c.clNpsMax)}"/><text x="${Wd - mr - 4}" y="${mt + 12}" text-anchor="end" style="fill:var(--crit-ink)">Weak zone</text>`;
  }
  const col = l => {
    if (l.status === 'A') return ['accent', 1];
    if (mode === 'up') return { upgrade: ['good', 1], queue: ['good', 0], near: ['warn', 1], no: ['ink-3', 1] }[l.up.bucket] || ['ink-3', 1];
    return { close: ['crit', 1], fix: ['serious', 1], keep: ['ink-3', 1] }[l.cl.bucket] || ['ink-3', 1];
  };
  const flag = l => mode === 'up' ? (l.up.bucket === 'upgrade' || l.up.bucket === 'queue' || l.up.bucket === 'near') : (l.cl.bucket === 'close' || l.cl.bucket === 'fix');
  labs.filter(l => l.nps != null).sort((a, b) => b.pm - a.pm).forEach(l => {
    const [cn, fill] = col(l), rr = 3.5 + Math.sqrt(l.pm) * 0.22;
    s += `<circle cx="${X(l.breach)}" cy="${Y(l.nps)}" r="${rr}" data-tip="${esc('<b>' + l.name + '</b><span class="mono">' + (l.status === 'A' ? 'Assured' : 'Non-Assured') + ' · ' + nf(l.pm) + ' orders/mo<br>TAT breach ' + num1(l.breach) + '% · NPS ' + nf(l.nps) + '</span>')}" data-lab="${l.idx}" style="fill:${fill ? 'var(--' + cn + ')' : 'var(--surface)'};fill-opacity:${fill ? .78 : 1};stroke:var(--${cn});stroke-width:${fill ? 1 : 1.8};cursor:pointer"/>`;
  });
  const placed = [];
  labs.filter(l => l.nps != null && flag(l)).sort((a, b) => a.nps - b.nps).slice(0, 12).forEach(l => {
    const nm = l.name.length > 16 ? l.name.slice(0, 15) + '\u2026' : l.name, w = nm.length * 5.4, x = X(l.breach) + 8 + Math.sqrt(l.pm) * 0.22; let y = Y(l.nps) + 3;
    for (let t = 0; t < 14 && placed.some(p => x < p[0] + p[2] && x + w > p[0] && Math.abs(y - p[1]) < 11); t++) y += 11;
    if (y > Ht - mb - 3) return;
    placed.push([x, y, w]); s += `<text class="lbl" x="${x}" y="${y}" style="pointer-events:none">${esc(nm)}</text>`;
  });
  s += '</svg>';
  const lg = mode === 'up' ? [['accent', 'Assured'], ['good', 'Upgrade now'], ['warn', 'Near miss'], ['ink-3', 'Not eligible']] : [['accent', 'Assured'], ['crit', 'Close'], ['serious', 'Fix or watch'], ['ink-3', 'Keep']];
  return `<div class="chart"><h4>${mode === 'up' ? 'Quality map: who sits in the upgrade zone' : 'Quality map: who sits in the weak zone'}</h4><div class="lg">${lg.map(x => `<span><i style="background:var(--${x[0]})"></i>${x[1]}</span>`).join('')}<span style="color:var(--ink-3)">Bubble size shows orders per month. Dashed lines show the thresholds on observed values. Decisions use the confidence-adjusted values.</span></div>${s}</div>`;
}
function histChart(a, b) {
  const Wd = 520, Ht = 230, ml = 34, mr = 8, mt = 8, mb = 34, n = a.share.length, gw = (Wd - ml - mr) / n, bw = Math.min(24, gw / 2 - 3);
  const ymax = Math.max(10, Math.ceil(Math.max(...a.share, ...b.share) / 10) * 10), Y = v => mt + (1 - v / ymax) * (Ht - mt - mb);
  const lbl = a.edges.map((e, i) => i === n ? null : (a.edges[i + 1] === Infinity ? e + '+' : e + '-' + a.edges[i + 1]));
  let s = `<svg viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="Distribution of customer travel distance before and after">`;
  for (let v = 0; v <= ymax; v += ymax / 4) s += `<line class="gl" x1="${ml}" x2="${Wd - mr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${ml - 5}" y="${Y(v) + 3}" text-anchor="end">${nf(v)}%</text>`;
  for (let i = 0; i < n; i++) {
    const cx = ml + gw * i + gw / 2;
    [[a.share[i], 'accent', -bw - 1, 'Before'], [b.share[i], 'orange', 1, 'After']].forEach(([v, c, off, nm]) => {
      const y = Y(v), h = Ht - mb - y;
      s += `<path d="M${cx + off} ${Ht - mb} V${y + 3} Q${cx + off} ${y} ${cx + off + 3} ${y} H${cx + off + bw - 3} Q${cx + off + bw} ${y} ${cx + off + bw} ${y + 3} V${Ht - mb} Z" style="fill:var(--${c})" data-tip="${esc('<b>' + lbl[i] + ' km</b><span class="mono">' + nm + ': ' + num1(v) + '% of orders</span>')}"/>`;
    });
    s += `<text x="${cx}" y="${Ht - mb + 14}" text-anchor="middle">${lbl[i]}</text>`;
  }
  const dm = S.cfg.dMax; let pos = null; for (let i = 0; i < n; i++) if (dm >= a.edges[i] && dm < a.edges[i + 1]) pos = i + (a.edges[i + 1] === Infinity ? 0 : (dm - a.edges[i]) / (a.edges[i + 1] - a.edges[i]));
  if (pos != null) s += `<line class="gate" x1="${ml + gw * pos}" x2="${ml + gw * pos}" y1="${mt}" y2="${Ht - mb}"/><text x="${ml + gw * pos + 4}" y="${mt + 10}" class="lbl">${dm} km limit</text>`;
  s += `<text x="${(ml + Wd - mr) / 2}" y="${Ht - 3}" text-anchor="middle" class="lbl">Road distance from customer to lab (km)</text></svg>`;
  return `<div class="chart"><h4>How far customers travel</h4><div class="lg"><span><i style="background:var(--accent)"></i>Today</span><span><i style="background:var(--orange)"></i>After the selected actions</span></div>${s}</div>`;
}

/* ---- method ---- */
PANES.method = function () {
  const c = S.cfg;
  return `<div class="method" style="display:flex;flex-direction:column;gap:10px">
  <h3>How the numbers are made</h3>
  <p>Everything runs in your browser on the files you load. The map has no street tiles because the page cannot fetch them. Positions are exact and use a Mercator plot with a scale bar.</p>
  <h3>1. Distance</h3>
  <p>For each order, the straight-line (haversine) distance to its lab is multiplied by the circuity factor (now ${c.circuity}) to estimate road distance. The network is summarised by average, median, 90th percentile and the share of orders within ${c.dMax} km. For each customer the nearest lab is also found, which separates a coverage gap (no lab near) from a routing choice (a lab is near but the order went elsewhere).</p>
  <div class="formula">road km = haversine(customer, lab) x circuity</div>
  <h3>2. Where a new lab is needed</h3>
  <ol><li>Underserved orders are those whose nearest lab of any type is further than ${c.dMax} km by road.</li>
  <li>They are bucketed into a ${c.gridKm} km grid per city. Each occupied cell is a candidate at the centroid of its orders.</li>
  <li>For a candidate, the captured orders are the underserved orders within ${c.catchKm} km by road that would be closer than today. Distance saved is the sum of (current nearest distance minus new distance).</li>
  <li>The candidate with the largest saving is chosen if it passes the tests: at least ${c.minViable} orders a month, at least ${c.minGainKm} km saved per order, and at least ${c.minSepKm} km from any lab. Its position is then pulled to the centroid of its customers.</li>
  <li>Its orders are removed and the search repeats, up to ${c.maxNewSites} times. This is the standard greedy method for maximum coverage and gives a result within a known bound of the best possible.</li></ol>
  <p>Type: Assured-track when no Assured lab is within ${c.catchKm} km or demand reaches ${c.assuredTrackOrders} orders a month, otherwise Non-Assured on probation.</p>
  <h3>3. Which labs become Assured</h3>
  <p>TAT breach and NPS come from small samples, so they are judged on confidence bounds, not point values.</p>
  <div class="formula">TAT breach: Wilson upper bound of the observed rate, n = orders behind the rate
NPS: lower bound = NPS - z x sqrt((1 - (NPS/100)^2) / n) x 100, n = NPS responses</div>
  <p>A lab passes when the breach bound is at most ${c.upBreachMax}%, the NPS bound is at least ${c.upNpsMin}, volume is at least ${c.upVolMin} orders a month and the composite score is at least ${c.upScoreMin}. The score is a weighted blend of four percentile ranks inside the labs in view: low TAT breach, high NPS, high volume and short average customer distance. Labs are upgraded best score first up to the Assured cap, then queued.</p>
  <h3>4. Which labs close</h3>
  <p>Closure needs weak performance, low volume and a safe move, all together. Weak means the breach lower bound is at or above ${c.clBreachMin}% or the NPS upper bound is at or below ${c.clNpsMax}. Candidates are tested weakest first. For each, every customer is reassigned to the nearest remaining lab, and the lab closes only if average extra distance is at most ${c.clMaxAddKm} km, at most ${c.clMaxPushedPct}% of its orders cross the ${c.dMax} km limit, and no receiving lab goes above ${c.clUtilCap}% of its capacity. An accepted closure changes the network used for the next test, so closures cannot pile onto the same neighbour.</p>
  <h3>5. Filters</h3>
  <p>City, PIN code and date filters set the customers in view. Lab volumes always use every order in the date range, so a lab in a quiet PIN code is not judged on a sliver of its orders. Monthly rates divide by the length of the date range.</p>
  <h3>What the model does not know</h3>
  <ul><li>Which modalities a lab offers (X-ray, ultrasound, CT, MRI). A lab is assumed to serve every order.</li><li>Real road or traffic time. Replace the circuity factor when you have routed distances.</li><li>The ordering page's actual routing weights. The Assured uplift is an assumption you can change.</li><li>Cost to open or run a lab. Viability is a single orders-a-month threshold.</li></ul></div>`;
};

    const meta = { name, at, mode, anon, nOrders: Math.round(D.totalOrders || 0), nLabs: D.labs.length, label: anon ? 'Anonymised' : D.label, sample: !!D.sample, cfg: Object.assign({}, S.cfg),
      cities: F.cities ? [...F.cities].map(i => nm[i]) : [], pins: F.pins ? [...F.pins].map(i => D.pins[i]) : [], dayFrom: F.dayFrom == null ? -1 : F.dayFrom, dayTo: F.dayTo == null ? -1 : F.dayTo };
    const file = { v: 1, meta, labs: { cities: pk.cities, pins: pk.pins, labs: pk.labs, hasDate: !!D.hasDate }, rows };
    await saveFile(id + '.json', JSON.stringify(file));
    const entry = { id, file: id + '.json', name, at, mode, anon, nOrders: meta.nOrders, nLabs: meta.nLabs, sample: meta.sample };
    if (S.indexState === 'ok') {
      const list = S.models.filter(m => m.id !== id).map(m => ({ id: m.id, file: m.file, name: m.name, at: m.at, mode: m.mode, anon: !!m.anon, nOrders: m.nOrders, nLabs: m.nLabs, sample: !!m.sample })); list.unshift(entry);
      setTimeout(() => saveFile('index.json', JSON.stringify({ models: list }, null, 1)), 500);
      st.innerHTML = 'Downloaded <b>' + esc(id) + '.json</b> and an updated <b>index.json</b>. If your browser asks, allow multiple downloads. Upload both to the <code>models</code> folder of the repository to publish.';
    } else {
      st.innerHTML = 'Downloaded <b>' + esc(id) + '.json</b>. The published list could not be read from this host, so no new index.json was made. To publish, add this entry to <code>models/index.json</code>: <code>' + esc(JSON.stringify(entry)) + '</code>';
    }
    go.textContent = 'Export again'; go.disabled = false;
  } catch (e) { go.disabled = false; st.innerHTML = '<span style="color:var(--crit-ink)">Could not export: ' + esc((e && e.message) || 'unknown error') + '</span>'; }
}

function openModelsModal() { modal.open = 'models'; renderModels(); loadIndex(true); }
function renderModels() {
  if (modal.open !== 'models') return;
  const rows = S.models.map(m => `<div class="mrow"><div class="meta"><b>${esc(m.name)}</b><span>${esc(fmtDate(m.at))} · ${nf(m.nOrders)} orders, ${m.nLabs} labs · ${m.mode === 'full' ? 'with orders' : 'labs and settings only'}${m.anon ? ' · lab names anonymised' : ''}${m.sample ? ' · sample data' : ''}</span></div>
    <div class="sumrow"><button class="btn sm primary" type="button" data-act="openModel" data-id="${esc(m.id)}">Open</button></div></div>`).join('');
  let empty = '';
  if (!S.models.length) empty = S.indexState === 'loading' ? '<div class="empty">Loading</div>' : S.indexState === 'ok' ? '<div class="empty">Nothing has been published yet. Analyses published by the owner appear here.</div>' : '<div class="empty">The published list is not available here. It loads when the app is opened from its hosted link, not from a downloaded file. You can still open an exported analysis file below.</div>';
  openModal(`<h2>Published analyses</h2><p class="note">Analyses published by the owner of this app. Opening one replaces your current data, parameters and filters. Your own uploads stay on your device.</p>${rows || empty}
  <div class="note muted">Have an exported analysis file? <button class="btn sm" type="button" data-act="pickFile">Open from file</button><input type="file" id="mFile" accept=".json,application/json" hidden></div>
  <div id="mStatus" class="note muted"></div><div class="acts"><button class="btn" type="button" data-act="closeModal">Close</button></div>`);
}
async function loadIndex(force) {
  if (!force && S.indexState !== 'loading') return;
  try {
    const r = await fetch('models/index.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.status === 404) { S.models = []; S.indexState = 'ok'; }
    else if (!r.ok) throw new Error('status ' + r.status);
    else { const j = await r.json(); S.models = (j.models || []).slice().sort((a, b) => (a.at < b.at ? 1 : -1)); S.indexState = 'ok'; }
  } catch (e) { S.models = []; S.indexState = 'fail'; }
  if (modal.open === 'models') renderModels();
}
async function loadModelObj(obj, closeAfter) {
  const meta = obj && obj.meta, lab = obj && obj.labs;
  if (!obj || obj.v !== 1 || !meta || !lab || !Array.isArray(lab.labs)) throw new Error('This is not a valid analysis file.');
  const labs = lab.labs.map(l => ({ id: l.id, name: l.name, lat: l.lat, lng: l.lng, cityIdx: l.c, city: lab.cities[l.c], pinIdx: l.p, pin: l.p >= 0 ? lab.pins[l.p] : '', status: l.s, breach: l.b, nps: l.n, npsN: l.nn, tatN: l.tn, cap: l.cp }));
  const arr = []; if (meta.mode === 'full' && obj.rows) for (const e of obj.rows.split(';')) arr.push(e.split(',').map(Number));
  const n = arr.length;
  const lat = new Float64Array(n), lng = new Float64Array(n), labKey = new Int32Array(n), city = new Int16Array(n), pin = new Int32Array(n), day = new Int32Array(n), w = new Float32Array(n); let anyDate = false;
  arr.forEach((a, i) => { lat[i] = a[0] / 1000; lng[i] = a[1] / 1000; labKey[i] = a[2]; pin[i] = a[3]; city[i] = a[4]; if (a[5] >= 0) { day[i] = a[5] * 7 + 3; anyDate = true; } else day[i] = -1; w[i] = a[6]; });
  const D = E.assemble({ n, lat, lng, labKey, city, pin, day, w, cities: lab.cities.slice(), pins: lab.pins.slice(), labKeyList: labs.map(l => l.id), hasDate: anyDate, warn: [] }, labs, { label: 'Analysis: ' + meta.name });
  E.finalize(D); D.sample = !!meta.sample;
  S.cfg = Object.assign({}, E.DEFAULTS, meta.cfg || {}); saveCfg();
  setDataset(D);
  const F = { cities: null, pins: null, dayFrom: D.hasDate ? D.dayMin : null, dayTo: D.hasDate ? D.dayMax : null };
  if (meta.cities && meta.cities.length) { const s = new Set(meta.cities.map(nm => D.cities.indexOf(nm)).filter(i => i >= 0)); if (s.size) F.cities = s; }
  if (meta.pins && meta.pins.length) { const s = new Set(meta.pins.map(p => D.pins.indexOf(p)).filter(i => i >= 0)); if (s.size) F.pins = s; }
  if (D.hasDate && meta.dayFrom >= 0) { F.dayFrom = Math.max(D.dayMin, meta.dayFrom); F.dayTo = Math.min(D.dayMax, meta.dayTo); }
  S.F = F; buildFilters(); S.refit = true; schedule(0);
  busy(''); closeModal();
  if (meta.mode !== 'full') { S.tab = 'data'; S.upMsg = { t: 'ok', h: 'Labs and settings loaded from "' + esc(meta.name) + '". Upload an order file to analyse.' }; renderTabs(); renderPane('force'); }
  else { S.paneTab = null; renderPane('force'); }
  toast('Opened "' + meta.name + '"');
}
async function openPublished(id) {
  const m = S.models.find(x => x.id === id), st = $('mStatus'); if (!m) return;
  try {
    if (st) st.textContent = 'Opening'; busy('Opening analysis');
    const r = await fetch('models/' + encodeURIComponent(m.file) + '?t=' + encodeURIComponent(m.at), { cache: 'no-store' });
    if (!r.ok) throw new Error('The file could not be found (status ' + r.status + ').');
    await loadModelObj(await r.json());
  } catch (e) { busy(''); const s2 = $('mStatus'); if (s2) s2.innerHTML = '<span style="color:var(--crit-ink)">Could not open: ' + esc((e && e.message) || 'unknown error') + '</span>'; }
}
async function openFromFile(f) {
  const st = $('mStatus');
  try { busy('Opening analysis'); await loadModelObj(JSON.parse(await f.text())); }
  catch (e) { busy(''); const s2 = $('mStatus'); if (s2) s2.innerHTML = '<span style="color:var(--crit-ink)">Could not open: ' + esc((e && e.message) || 'unknown error') + '</span>'; }
}
function wireModal() {
  $('btnData').onclick = () => { S.tab = 'data'; renderTabs(); renderPane('force'); document.querySelector('.panel').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  $('btnModels').onclick = openModelsModal; $('btnSave').onclick = openExportModal;
  $('modal').addEventListener('click', e => {
    if (e.target === $('modal')) { closeModal(); return; }
    const a = e.target.closest('[data-act]'); if (!a) return; const act = a.dataset.act;
    if (act === 'closeModal') closeModal(); else if (act === 'doExport') doExport(); else if (act === 'openModel') openPublished(a.dataset.id); else if (act === 'pickFile') { const i = $('mFile'); if (i) i.click(); }
  });
  $('modal').addEventListener('change', e => { if (e.target.id === 'mFile' && e.target.files[0]) openFromFile(e.target.files[0]); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden) closeModal(); });
}

/* ---------- start ---------- */
function start() {
  wireFilters(); wirePane(); wireDrops(); wireModal(); renderMapTools(); renderLegend();
  busy('Preparing sample data');
  setTimeout(() => { loadSample(); busy(''); loadIndex(); }, 40);
}
start();

})();
</script>
</body></html>
